name: meta-mba-agent
version: 1.0.0
description: "A Hermes Agent skill pack for Meta business agent operations."
hermes_requires: ">=0.23.0"
license: "MIT"
author: "Amir Marmul"

env_requires:
  - name: META_ACCESS_TOKEN
    description: "Meta Graph API access token used by mba CLI and direct Graph API workflows"
    required: true
  - name: META_ENTITY_ID
    description: "Default Meta entity id for managing and Graph API workflows."
    required: true

distribution_owned:
  - SOUL.md
  - config.yaml
  - distribution.yaml
  - skills/meta/