name: meta-mba-agent
version: 1.0.0
description: "A Hermes Agent skill pack for Meta business agent operations."
hermes_requires: ">=0.23.0"
license: "MIT"
author: "Amir Marmul"

# Meta credentials are intentionally NOT declared here: .env is deprecated for
# META_ACCESS_TOKEN / META_ENTITY_ID. They are configured by the mba-setup skill
# into <profile>/workspace/mba/config.json. Provider keys (e.g. HERMES_CUSTOM_LLM_API_KEY)
# remain normal .env secrets and are not distribution requirements.

distribution_owned:
  - SOUL.md
  - config.yaml
  - distribution.yaml
  - skills/meta/
